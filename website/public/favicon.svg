<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 310">
  <!-- Monitor outer body -->
  <rect x="14" y="8" width="342" height="244" rx="18" fill="#3A3D40"/>
  <!-- Screen -->
  <rect x="27" y="20" width="316" height="215" rx="6" fill="#111416"/>
  <!-- Stand stem -->
  <path d="M155 252 L215 252 L207 290 L163 290 Z" fill="#5A5E62"/>
  <!-- Stand base -->
  <rect x="104" y="288" width="162" height="14" rx="6" fill="#5A5E62"/>

  <!-- ══════════════════════════
       K  (cyan)
       Spine: top(82,58) mid(82,128) bot(82,198)
       Left cap: (45,128)
       Upper-right arm: (145,58)
       Lower-right arm: (145,198)
       ══════════════════════════ -->
  <g stroke="#0DCEFF" stroke-width="4.5" stroke-linecap="round" fill="none">
    <line x1="82"  y1="58"  x2="82"  y2="128"/>
    <line x1="82"  y1="128" x2="82"  y2="198"/>
    <line x1="82"  y1="128" x2="45"  y2="128"/>
    <line x1="82"  y1="128" x2="145" y2="58"/>
    <line x1="82"  y1="128" x2="145" y2="198"/>
  </g>
  <g fill="#0DCEFF">
    <circle cx="82"  cy="58"  r="10"/>
    <circle cx="82"  cy="128" r="10"/>
    <circle cx="82"  cy="198" r="10"/>
    <circle cx="45"  cy="128" r="10"/>
    <circle cx="145" cy="58"  r="10"/>
    <circle cx="145" cy="198" r="10"/>
  </g>

  <!-- ══════════════════════════════════════
       3  (lime)
       Right spine: TR(237,58) MR(237,128) BR(237,198)
       Top bar:    TL(164,58)  → TR
       Mid arm:    ML(175,128) → MR  (shorter than top/bot)
       Bottom bar: BL(164,198) → BR
       ══════════════════════════════════════ -->
  <g stroke="#CDF700" stroke-width="4.5" stroke-linecap="round" fill="none">
    <line x1="164" y1="58"  x2="237" y2="58"/>   <!-- top bar -->
    <line x1="237" y1="58"  x2="237" y2="128"/>  <!-- spine upper -->
    <line x1="237" y1="128" x2="175" y2="128"/>  <!-- middle arm (short) -->
    <line x1="237" y1="128" x2="237" y2="198"/>  <!-- spine lower -->
    <line x1="237" y1="198" x2="164" y2="198"/>  <!-- bottom bar -->
  </g>
  <g fill="#CDF700">
    <circle cx="164" cy="58"  r="10"/>
    <circle cx="237" cy="58"  r="10"/>
    <circle cx="175" cy="128" r="10"/>
    <circle cx="237" cy="128" r="10"/>
    <circle cx="164" cy="198" r="10"/>
    <circle cx="237" cy="198" r="10"/>
  </g>

  <!-- ══════════════════════════════════════
       d  (lime)
       Stem top: ST(315,45) — extends above bowl
       Bowl top-right: RT(315,98)
       Bowl top-left:  LT(257,98)
       Bowl bot-left:  LB(257,168)
       Bowl bot-right: RB(315,168)  (also stem bottom)
       Edges: ST-RT (stem), RT-LT-LB-RB (bowl 3 sides), RB-RT (right side closes bowl)
       ══════════════════════════════════════ -->
  <g stroke="#CDF700" stroke-width="4.5" stroke-linecap="round" fill="none">
    <line x1="315" y1="45"  x2="315" y2="98"/>   <!-- stem above bowl -->
    <line x1="315" y1="98"  x2="257" y2="98"/>   <!-- bowl top -->
    <line x1="257" y1="98"  x2="257" y2="168"/>  <!-- bowl left -->
    <line x1="257" y1="168" x2="315" y2="168"/>  <!-- bowl bottom -->
    <line x1="315" y1="168" x2="315" y2="98"/>   <!-- bowl right / stem within bowl -->
  </g>
  <g fill="#CDF700">
    <circle cx="315" cy="45"  r="10"/>
    <circle cx="315" cy="98"  r="10"/>
    <circle cx="257" cy="98"  r="10"/>
    <circle cx="257" cy="168" r="10"/>
    <circle cx="315" cy="168" r="10"/>
  </g>
</svg>
