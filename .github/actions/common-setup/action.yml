name: 'Common Setup'
description: 'Checks out code and sets up the environment'

# 1. Define the input here
inputs:
  github_token:
    description: 'GitHub Token for authentication'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        # 2. Reference the input, NOT the secret directly
        token: ${{ inputs.github_token }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        token: ${{ inputs.github_token }}

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-4-dev \
          libwebkitgtk-6.0-dev \
          build-essential clang \
          libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev \
          libglib2.0-dev \
          libnotify-dev \
          libgdk-pixbuf2.0-dev \
          libcairo2-dev \
          libpango1.0-dev \
          libatk1.0-dev
      shell: bash

    - name: Install NSIS (Windows only)
      if: runner.os == 'Windows'
      run: |
        choco install nsis -y
        Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
      shell: pwsh

    - name: Install Wails
      shell: bash
      run: |
        go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.95

    - name: Install task
      shell: bash
      run: |
        go install github.com/go-task/task/v3/cmd/task@latest

    - name: Set Version
      run: |
        APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
        echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
        echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
        echo "ARCH=${{ runner.arch }}" >> $GITHUB_ENV
        echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      shell: bash

