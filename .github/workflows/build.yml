name: Wails build

on:
  push:
    tags:
    # Match any new tag
      - '*'

env:
  # Necessary for most environments as build failure can occur due to OOM issues
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
    # Failure in one platform build won't impact the others
      fail-fast: false
      matrix:
        build:
          - name: 'App'
            platform:  'linux/amd64'
            os: 'ubuntu-latest'
            goos: 'linux'
            goarch: 'amd64'
          - name: 'App'
            platform:  'windows/amd64'
            os: 'windows-latest'
            goos: 'windows'
            goarch: 'amd64'
          - name: 'App'
            platform:  'darwin/arm64'
            os: 'macos-latest'
            goos: 'darwin'
            goarch: 'arm64'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Export correct GOOS/GOARCH/ARCH for all platforms
      - name: Set Go environment
        shell: bash
        run: |
          # Normalize architecture names (e.g., X64 -> amd64)
          RAW_ARCH="${{ matrix.build.goarch }}"
          NORM_ARCH=$(echo "$RAW_ARCH" | tr '[:upper:]' '[:lower:]' | sed 's/x64/amd64/')
          
          echo "GOOS=${{ matrix.build.goos }}" >> $GITHUB_ENV
          echo "GOARCH=$NORM_ARCH" >> $GITHUB_ENV
          echo "ARCH=$NORM_ARCH" >> $GITHUB_ENV

      # Install build-essential and clang for native Linux builds
      - name: Install build-essential (Linux only)
        if: matrix.build.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang

      # Set version from git tag (strips leading 'v', e.g. v1.2.3 → 1.2.3)
      - name: Set version from git tag
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      # Build
      - name: Build
        run: |
          task package

      - name: Upload Artifacts (Linux)
        if: matrix.build.goos == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: k3desktop-linux-${{ matrix.build.goarch }}
          path: |
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm
            bin/*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Windows)
        if: matrix.build.goos == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: k3desktop-windows-${{ matrix.build.goarch }}
          path: |
            bin/*.exe
            build/windows/nsis/*-installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package macOS app bundle into zip
        if: matrix.build.goos == 'darwin'
        shell: bash
        run: |
          cd bin
          zip -r --symlinks k3desktop-macos-${{ matrix.build.goarch }}.zip k3desktop.app

      - name: Upload Artifacts (macOS)
        if: matrix.build.goos == 'darwin'
        uses: actions/upload-artifact@v7
        with:
          name: k3desktop-macos-${{ matrix.build.goarch }}
          path: bin/k3desktop-macos-${{ matrix.build.goarch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.zst
            artifacts/**/*.exe
            artifacts/**/*-installer.exe
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}