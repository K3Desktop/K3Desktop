name: Deploy Website

on:
  push:
    branches: [main]
    paths: ['website/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: Build site
        run: npm run build
        working-directory: website
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: k3desktop.github.io
      - name: Deploy to Documentation Repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ steps.generate_token.outputs.token }}
          external_repository: K3Desktop/k3desktop.github.io
          publish_branch: main
          publish_dir: ./website/dist
          force_orphan: true
          commit_message: "deploy: documentation update from ${GITHUB_SHA::8}"
