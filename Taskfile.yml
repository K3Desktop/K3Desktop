version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "k3desktop"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  VERSION:
    sh: cat VERSION 2>/dev/null | tr -d '[:space:]' || echo "dev"
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"

tasks:
  trivy:
    summary: Scans the built Docker image for vulnerabilities using Trivy
    cmds:
      - trivy fs --exit-code 1  . --disable-telemetry
      
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  release:prepare:
    summary: Sets the version and syncs it into all build metadata files
    desc: |
      Updates the VERSION file and propagates it to build/config.yml,
      platform Info.plist/info.json (via wails3 update build-assets),
      and frontend/package.json.
      Usage: task release:prepare VERSION=1.2.3
    cmds:
      - printf '%s\n' "{{.VERSION}}" > VERSION
      - task: common:version:sync
        vars:
          VERSION: '{{.VERSION}}'
    requires:
      vars: [VERSION]
